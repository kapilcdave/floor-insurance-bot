[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "floor-insurance-bot"
version = "0.4.0"
description = "Resource-light 0DTE credit-spread research and Alpaca bot"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Floor Insurance Bot contributors"}]
dependencies = ["requests>=2.32,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.12,<1"]

[project.scripts]
floor-insurance = "floor_insurance.cli:main"
floor-insurance-backtest = "floor_insurance.backtest:main"
floor-directional-backtest = "floor_insurance.directional_backtest:main"
floor-directional-experiments = "floor_insurance.directional_experiments:main"
floor-credit-structure = "floor_insurance.credit_experiments:main"
floor-atm-trend-research = "floor_insurance.atm_trend_research:main"
floor-implied-move-research = "floor_insurance.implied_move_research:main"
floor-fifty-credit-research = "floor_insurance.fifty_credit_research:main"
floor-iron-fly-research = "floor_insurance.iron_fly_research:main"
floor-adaptive-iron-fly-research = "floor_insurance.adaptive_iron_fly_research:main"
floor-option-flow-research = "floor_insurance.option_flow_research:main"
floor-adaptive-option-flow-research = "floor_insurance.adaptive_option_flow_research:main"
floor-delayed-option-flow-research = "floor_insurance.delayed_option_flow_research:main"
floor-constituent-lead-research = "floor_insurance.constituent_lead_research:main"
floor-sparse-constituent-lead-research = "floor_insurance.sparse_constituent_lead_research:main"
floor-implied-condor-research = "floor_insurance.implied_condor_research:main"
floor-conformal-condor-research = "floor_insurance.conformal_condor_research:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
